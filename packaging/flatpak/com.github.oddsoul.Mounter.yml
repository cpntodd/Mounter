app-id: com.github.oddsoul.Mounter
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: mounter
finish-args:
  - --share=network
  - --share=ipc
  - --socket=session-bus
  - --socket=system-bus
  - --filesystem=host
  - --filesystem=/proc/mounts:ro
  - --system-talk-name=org.freedesktop.PolicyKit1
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
modules:
  - name: mounter
    buildsystem: meson
    config-opts:
      - -Dprefix=/app
      - -Dlibexecdir=/app/libexec
    sources:
      - type: git
        url: https://github.com/cpntodd/Mounter.git
        tag: master
